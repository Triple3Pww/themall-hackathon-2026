<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Cap Garage 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D garage, a quiet counting panel top-left, one control bar at the bottom. Single dark look on purpose. */
:root{
  --bg:#0c0e12; --panel:rgba(14,17,22,.86); --line:#2a303a; --ink:#e9edf2; --mute:#8b94a3;
  --go:#3ee08a; --up:#59c3ff; --cam:#ff6b8a; --circ:#ffb547;
  --f-body:'Noto Sans Thai',Thonburi,'Leelawadee UI',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:12px 16px;min-width:230px;font-size:14px;font-weight:600;backdrop-filter:blur(6px)}
#hud .r{display:flex;justify-content:space-between;gap:18px;padding:3px 0;color:#c3cad4}
#hud .r b{font-family:var(--f-num);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
#hud .cam{color:var(--cam)} #hud .cam b{color:var(--ink)}
#hud .circ{color:var(--circ)} #hud .circ b{color:var(--circ)}
#hud .r[hidden]{display:none}
#hud .sum{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;color:var(--ink);font-weight:800}
#hud .sum b{font-size:18px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none}
#bar button{pointer-events:auto;font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:0 18px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;backdrop-filter:blur(6px)}
#bar button:hover{border-color:#4a525e}
#bar button:focus-visible{outline:3px solid var(--up);outline-offset:2px}
#bar button[aria-pressed="true"]{background:var(--ink);color:#0c0e12;border-color:var(--ink)}
#bar .in{border-color:rgba(62,224,138,.55);color:var(--go)}
#bar .out{border-color:rgba(255,107,138,.55);color:var(--cam)}
#big{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:10px 20px 14px;text-align:right;backdrop-filter:blur(6px)}
#big .lbl{font-size:14px;font-weight:700;color:var(--mute)}
#big .num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;font-size:72px;line-height:1;color:var(--ink)}
#big .num small{font-size:40px;color:var(--mute)}
@media (max-width:520px){#hud{min-width:0;font-size:12px;padding:8px 12px}#hud .r b{font-size:13px}#bar button{font-size:13px;padding:0 12px}#big{padding:6px 12px 8px}#big .num{font-size:40px}#big .num small{font-size:24px}}
</style>

<div id="stage" aria-label="จำลองที่จอดรถ 3 มิติ: ทางวน ป้าย และชั้น P3" role="img"></div>

<div id="hud" aria-live="polite">
  <div class="r cam"><span>CAM 1 · เข้า</span><b id="hIn">0</b></div>
  <div class="r cam"><span>CAM 2 · ออก</span><b id="hOut">0</b></div>
  <div class="r camdata"><span>รถในชั้น</span><b id="hOn">0</b></div>
  <div class="r"><span>จอดแล้ว (เซนเซอร์)</span><b id="hPark">0</b></div>
  <div class="r circ camdata"><span>กำลังวนหา</span><b id="hCirc">0</b></div>
  <div class="r"><span>ช่องว่าง</span><b id="hFree">0</b></div>
  <div class="r sum"><span>เหลือจริง P3</span><b id="hEff">0</b></div>
  <div class="r"><span>เหลือจริง P4</span><b id="hP4">0</b></div>
</div>

<div id="big" aria-live="polite">
  <div class="lbl" id="bigLbl">รถในชั้น P3 / ช่องทั้งหมด</div>
  <div class="num"><span id="bigOn">0</span><small>/<span id="bigCap">0</span></small></div>
</div>

<div id="bar">
  <button id="bIn" class="in" type="button">+ รถเข้า</button>
  <button id="bOut" class="out" type="button">รถออกจาก P3</button>
  <button id="bAuto" type="button" aria-pressed="true">อัตโนมัติ</button>
  <button id="bView" type="button" aria-pressed="false">มุมคนขับ</button>
  <button id="bFault" type="button" aria-pressed="false">กล้องขัดข้อง</button>
  <button id="bHud" type="button" aria-pressed="true">ตัวเลข</button>
  <button id="bMode" type="button" aria-pressed="false">ระบบเดิม</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';

/* ---------- renderer / scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0e12);
scene.fog = new THREE.Fog(0x0c0e12, 60, 140);

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 300);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 8; controls.maxDistance = 110;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < 640 ? 62 : 48; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xbfd2ff, 0x1a1c20, 0.55));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.55);
sun.position.set(6, 40, 16); sun.target.position.set(6, 0, -14);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 40, bottom: -40, near: 1, far: 100 });
scene.add(sun, sun.target);
[[-11, -14, 3], [16, -6, 4.2], [16, -22, 4.2]].forEach(([x, z, y]) => { const l = new THREE.PointLight(0xfff1d6, 0.6, 28, 2); l.position.set(x, y, z); scene.add(l); });

/* ---------- materials + helpers ---------- */
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0.05 }, o));
const mat = {
  lane: M(0x2f333a, { side: THREE.DoubleSide }), inner: M(0x2a2d33, { side: THREE.DoubleSide }),
  slab: M(0x24272d, { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
  wall: M(0x3a3e45, { side: THREE.DoubleSide }), pillar: M(0x50555d), curb: M(0x5d6168), core: M(0x454a52),
  white: new THREE.MeshBasicMaterial({ color: 0xcfd3d8 }), yellow: new THREE.MeshBasicMaterial({ color: 0xd9c46a, side: THREE.DoubleSide }),
};
function box(w, h, d, m, x, y, z, shadow = true) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.set(x, y, z); b.castShadow = shadow; b.receiveShadow = true; scene.add(b); return b;
}
function flat(w, d, m, x, z, y = 0.012) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
  p.rotation.x = -Math.PI / 2; p.position.set(x, y, z); p.receiveShadow = true; scene.add(p); return p;
}

/* ---------- looped ramp (helix) ----------
   Centre C. Outer lane (r 7..12) goes UP as θ decreases, with a flat landing at P3 (θ 1.25 .. -1.25).
   Inner lane (r 2.6..6.6) goes DOWN as θ decreases; cars leaving P3 join it at θ = -π/2.
   P3 floor: x 4..34, z -30..4. Entry z = -6, exit z = -22, counting cameras on the line x = 5. */
const C = { x: -11, z: -14 };
const R_OUT = 9.5, R_IN = 4.6, K_OUT = 1.1, K_IN = 0.6, LAND = 1.25;
const yOut = t => t > LAND ? -(t - LAND) * K_OUT : t < -LAND ? (-LAND - t) * K_OUT : 0;
const yIn = t => (t + Math.PI / 2) * K_IN;
const onCircle = (r, t) => ({ x: C.x + r * Math.cos(t), z: C.z + r * Math.sin(t) });

function ribbon(r0, r1, a, b, yFn, m, seg = 160) {
  const pos = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = a + (b - a) * i / seg, y = yFn(t);
    const p0 = onCircle(r0, t), p1 = onCircle(r1, t);
    pos.push(p0.x, y, p0.z, p1.x, y, p1.z);
    if (i < seg) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, m); mesh.receiveShadow = true; scene.add(mesh); return mesh;
}
function railing(r, a, b, yFn, h, skip = () => false, seg = 160, drop = 0.35) {
  const pos = [], idx = []; let n = 0;
  for (let i = 0; i < seg; i++) {
    const t0 = a + (b - a) * i / seg, t1 = a + (b - a) * (i + 1) / seg;
    if (skip((t0 + t1) / 2)) continue;
    const p0 = onCircle(r, t0), p1 = onCircle(r, t1), y0 = yFn(t0), y1 = yFn(t1);
    pos.push(p0.x, y0 - drop, p0.z, p1.x, y1 - drop, p1.z, p0.x, y0 + h, p0.z, p1.x, y1 + h, p1.z);
    idx.push(n, n + 1, n + 2, n + 1, n + 3, n + 2); n += 4;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, mat.wall); mesh.castShadow = true; scene.add(mesh); return mesh;
}
const OUT_A = LAND + 4.0, OUT_B = -LAND - 2.2, IN_A = -Math.PI / 2 + 2.0, IN_B = -Math.PI / 2 - 5.0;
ribbon(7, 12, OUT_A, OUT_B, yOut, mat.lane);
ribbon(2.6, 6.6, IN_A, IN_B, yIn, mat.inner);
railing(12, OUT_A, OUT_B, yOut, 0.9, t => t < LAND + 0.05 && t > -LAND - 0.05);
railing(6.8, OUT_A, OUT_B, yOut, 0.9, t => t < 0.2 && t > -2.3);
railing(2.5, IN_A, IN_B, yIn, 0.6);
ribbon(11.85, 12, OUT_A, OUT_B, t => yOut(t) + 0.01, mat.yellow);
const core = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.3, 9, 32), mat.core);
core.position.set(C.x, -1.5, C.z); core.castShadow = true; scene.add(core);
// painted arrows along the lanes
function laneArrow(r, t, yFn, s = 0.8) {
  const sh = new THREE.Shape();
  sh.moveTo(0, 1.4 * s); sh.lineTo(0.7 * s, 0.4 * s); sh.lineTo(0.25 * s, 0.4 * s); sh.lineTo(0.25 * s, -1.2 * s);
  sh.lineTo(-0.25 * s, -1.2 * s); sh.lineTo(-0.25 * s, 0.4 * s); sh.lineTo(-0.7 * s, 0.4 * s); sh.closePath();
  const a = new THREE.Mesh(new THREE.ShapeGeometry(sh), mat.white);
  const p = onCircle(r, t), hd = Math.atan2(Math.sin(t), -Math.cos(t));
  a.rotation.order = 'YXZ'; a.rotation.set(-Math.PI / 2, hd + Math.PI, 0); a.position.set(p.x, yFn(t) + 0.03, p.z); scene.add(a);
}
[3.2, 2.4, 0.3, -1.9].forEach(t => laneArrow(R_OUT, t, yOut));
[-2.4, -3.6].forEach(t => laneArrow(R_IN, t, yIn, 0.6));

/* ---------- P3 floor ---------- */
flat(30, 34, mat.slab, 19, -13, 0);
flat(7, 22, mat.slab, 0.5, -14, -0.01);
box(0.4, 1.1, 34, mat.wall, 34.2, 0.55, -13);
box(30.4, 1.1, 0.4, mat.wall, 19, 0.55, -30.2);
box(30.4, 1.1, 0.4, mat.wall, 19, 0.55, 4.2);
box(0.35, 0.9, 7.7, mat.curb, 4, 0.45, 0.35);
box(0.35, 0.9, 11, mat.curb, 4, 0.45, -14);
box(0.35, 0.9, 5.5, mat.curb, 4, 0.45, -27.25);
[[4, 4], [4, -14], [4, -30], [17.6, -14], [26, -14], [10, -14]].forEach(([x, z]) => box(0.8, 4.6, 0.8, mat.pillar, x, 2.3, z));
function arrow(x, z, rotY, s = 0.8) {
  const sh = new THREE.Shape();
  sh.moveTo(0, 1.4 * s); sh.lineTo(0.7 * s, 0.4 * s); sh.lineTo(0.25 * s, 0.4 * s); sh.lineTo(0.25 * s, -1.2 * s);
  sh.lineTo(-0.25 * s, -1.2 * s); sh.lineTo(-0.25 * s, 0.4 * s); sh.lineTo(-0.7 * s, 0.4 * s); sh.closePath();
  const a = new THREE.Mesh(new THREE.ShapeGeometry(sh), mat.white);
  a.rotation.set(-Math.PI / 2, 0, rotY); a.position.set(x, 0.02, z); scene.add(a);
}
arrow(18, -6, -Math.PI / 2); arrow(31.5, -14, Math.PI); arrow(18, -22, Math.PI / 2);

/* ---------- bays + sensors ---------- */
const BAY_W = 2.7, ROWS = [{ z: -1, aisle: -6, face: 0 }, { z: -11, aisle: -6, face: Math.PI }, { z: -17, aisle: -22, face: 0 }, { z: -27, aisle: -22, face: Math.PI }];
const bays = [];
ROWS.forEach(r => {
  for (let i = 0; i < 8; i++) {
    const x = 8.5 + i * BAY_W;
    flat(0.1, 5, mat.white, x - BAY_W / 2, r.z, 0.016);
    if (i === 7) flat(0.1, 5, mat.white, x + BAY_W / 2, r.z, 0.016);
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.18, 20), new THREE.MeshBasicMaterial({ color: 0x3ee08a }));
    dot.rotation.x = -Math.PI / 2;
    dot.position.set(x, 0.03, r.z + (r.aisle > r.z ? 2.2 : -2.2)); scene.add(dot);
    bays.push({ x, z: r.z, aisle: r.aisle, face: r.face, occupied: false, reserved: false, dot });
  }
});
const CAP = bays.length;
const UP_AT = 32;  // cars on P3 needed before the sign shows UP
function setBay(b, occ) { b.occupied = occ; b.dot.material.color.set(occ ? 0xe05d5d : 0x3ee08a); }

/* ---------- counting cameras ---------- */
function makeCam(z) {
  const g = new THREE.Group();
  const housing = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.7), M(0xd6dae0, { roughness: 0.4 }));
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.1, 20), M(0x111111, { roughness: 0.2 }));
  lens.position.set(0, -0.22, 0);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.08), mat.pillar); arm.position.y = 0.45;
  g.add(housing, lens, arm); g.position.set(5, 4.0, z); scene.add(g);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(2.4, 3.8, 32, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xff6b8a, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false }));
  cone.position.set(5, 1.95, z); scene.add(cone);
  const beam = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 5), new THREE.MeshBasicMaterial({ color: 0xff6b8a, transparent: true, opacity: 0.5 }));
  beam.rotation.x = -Math.PI / 2; beam.position.set(5, 0.025, z); scene.add(beam);
  return { g, cone, beam, flash: 0 };
}
const cams = { in: makeCam(-6), out: makeCam(-22) };

/* ---------- sign on a gantry at the front of P3, where the landing starts ---------- */
const SIGN_T = 1.32;
const signLaneY = yOut(SIGN_T), signPos = onCircle(R_OUT, SIGN_T);
const signFacing = Math.atan2(-Math.sin(SIGN_T), Math.cos(SIGN_T)); // faces oncoming cars
const signCanvas = document.createElement('canvas'); signCanvas.width = 1600; signCanvas.height = 800;
const sctx = signCanvas.getContext('2d');
const signTex = new THREE.CanvasTexture(signCanvas); signTex.encoding = THREE.sRGBEncoding; signTex.anisotropy = 8;
const signGroup = new THREE.Group();
signGroup.position.set(signPos.x, signLaneY + 2.65, signPos.z); signGroup.rotation.y = signFacing; scene.add(signGroup);
const housing = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.35, 0.22), M(0x23272e, { roughness: 0.5, metalness: 0.3 }));
housing.castShadow = true; signGroup.add(housing);
const face = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 2.1), new THREE.MeshBasicMaterial({ map: signTex, toneMapped: false }));
face.position.z = 0.115; signGroup.add(face);
[-2.45, 2.45].forEach(x => {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 4.0, 0.16), mat.pillar); post.position.set(x, -0.65, 0); post.castShadow = true; signGroup.add(post);
});
const bar = new THREE.Mesh(new THREE.BoxGeometry(5.06, 0.16, 0.16), mat.pillar); bar.position.set(0, 1.28, 0); signGroup.add(bar);
const signGlow = new THREE.PointLight(0x3ee08a, 0.9, 9, 2);
signGlow.position.set(signPos.x - Math.sin(signFacing) * -2, signLaneY + 2.2, signPos.z - Math.cos(signFacing) * -2); scene.add(signGlow);

const COLORS = { GO: '#3ee08a', UP: '#59c3ff', NO: '#8b94a3' };
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const TH = '"Noto Sans Thai", Thonburi, sans-serif', MONO = '"JetBrains Mono", monospace';
function drawSign(advice, here, above) {
  const c = sctx, W = 1280, H = 640;
  c.setTransform(1.25, 0, 0, 1.25, 0, 0);
  c.fillStyle = '#05070a'; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,0.02)'; for (let y = 0; y < H; y += 4) c.fillRect(0, y, W, 2);
  const col = COLORS[advice], off = advice === 'NO';

  // instruction row
  c.save(); c.translate(185, 205); c.strokeStyle = col; c.lineWidth = 30; c.lineCap = 'round'; c.lineJoin = 'round';
  if (!off) { c.shadowColor = col; c.shadowBlur = 28; }
  c.beginPath();
  if (advice === 'GO') { c.moveTo(-50, 120); c.lineTo(-50, 10); c.quadraticCurveTo(-50, -45, 5, -45); c.lineTo(85, -45); c.moveTo(40, -95); c.lineTo(90, -45); c.lineTo(40, 5); }
  else if (advice === 'UP') { c.moveTo(0, 125); c.lineTo(0, -110); c.moveTo(-62, -48); c.lineTo(0, -110); c.lineTo(62, -48); }
  else { c.lineWidth = 22; c.arc(0, 0, 96, 0, Math.PI * 2); c.moveTo(-50, 0); c.lineTo(50, 0); }
  c.stroke(); c.restore();
  c.save(); c.fillStyle = col; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  if (!off) { c.shadowColor = col; c.shadowBlur = 30; }
  c.font = `900 205px ${TH}`;
  c.fillText(advice === 'GO' ? 'เข้าได้เลย' : advice === 'UP' ? 'ขึ้นชั้นบน' : 'ไม่แนะนำ', 345, off ? 250 : 290, 890);
  c.restore();
  if (off) { c.fillStyle = '#9aa3af'; c.font = `700 64px ${TH}`; c.textAlign = 'left'; c.fillText('ข้อมูลไม่พอ', 350, 345); }

  // two floors, each number sits right beside its own floor chip
  c.fillStyle = '#2a2f38'; c.fillRect(30, 398, W - 60, 4); c.fillRect(638, 420, 4, 196);
  const cell = (x0, label, floor, val, hl, filled) => {
    const cx = x0 + 125;
    roundRect(c, x0 + 30, 428, 190, 180, 20);
    if (filled) { c.fillStyle = '#f2f4f7'; c.fill(); } else { c.strokeStyle = '#aab2bd'; c.lineWidth = 5; c.stroke(); }
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = filled ? '#0b0d10' : '#e9edf2';
    c.font = `800 42px ${TH}`; c.fillText(label, cx, 480);
    c.font = `700 88px ${MONO}`; c.fillText(floor, cx, 558);
    c.save(); c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillStyle = off ? '#666e7a' : hl ? col : '#f2f4f7';
    if (hl && !off) { c.shadowColor = col; c.shadowBlur = 22; }
    c.font = `700 176px ${MONO}`; c.fillText(val, x0 + 250, 585);
    const w = c.measureText(val).width; c.restore();
    c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = '#9aa3af'; c.font = `700 48px ${TH}`;
    c.fillText('ช่อง', x0 + 262 + w, 585);
  };
  cell(0, 'ชั้นนี้', 'P3', here, advice === 'GO', true);
  cell(640, 'ชั้นบน', 'P4', above, advice === 'UP', false);
  signTex.needsUpdate = true;
  signGlow.color.set(col); signGlow.intensity = off ? 0.25 : 0.9;
}

/* ---------- cars ---------- */
const PAINT = [0xd8dce2, 0x1f2329, 0x9aa1ab, 0x8b1e2b, 0x2d4f7c, 0xf2f2ee, 0x3d4a3a, 0x5b6170, 0xb7a68a];
const glass = M(0x0e1217, { roughness: 0.15, metalness: 0.6 });
const tyre = M(0x111214, { roughness: 0.9 });
const headM = new THREE.MeshBasicMaterial({ color: 0xfff6e0 }), tailM = new THREE.MeshBasicMaterial({ color: 0xd2232f });
function makeCar() {
  const g = new THREE.Group();
  const paint = M(PAINT[Math.floor(Math.random() * PAINT.length)], { roughness: 0.35, metalness: 0.45 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.62, 4.3), paint); body.position.y = 0.6;
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.12, 1.2), paint); hood.position.set(0, 0.95, 1.45);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 2.2), glass); cabin.position.set(0, 1.18, -0.25);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 1.8), paint); roof.position.set(0, 1.49, -0.3);
  [body, hood, cabin, roof].forEach(m => { m.castShadow = true; g.add(m); });
  [[-0.88, 1.35], [0.88, 1.35], [-0.88, -1.35], [0.88, -1.35]].forEach(([x, z]) => {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.28, 18), tyre); w.rotation.z = Math.PI / 2; w.position.set(x, 0.36, z); g.add(w);
  });
  [-0.6, 0.6].forEach(x => {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.14, 0.05), headM); h.position.set(x, 0.72, 2.16); g.add(h);
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.12, 0.05), tailM); t.position.set(x, 0.74, -2.16); g.add(t);
  });
  g.rotation.order = 'YXZ';
  scene.add(g); return g;
}

/* ---------- routes ---------- */
const P = (x, z, o = {}) => Object.assign({ x, z, y: 0 }, o);
function helix(r, a, b, yFn, step = 0.12) {
  const pts = [], n = Math.max(1, Math.round(Math.abs(b - a) / step));
  for (let i = 1; i <= n; i++) { const t = a + (b - a) * i / n, p = onCircle(r, t); pts.push(P(p.x, p.z, { y: yFn(t) })); }
  return pts;
}
const SPAWN_T = LAND + 3.4;
const DECIDE_T = 1.08;                                   // just past the sign
const APPROACH = helix(R_OUT, SPAWN_T, DECIDE_T, yOut);
APPROACH[APPROACH.length - 1].decide = true;
const TO_ENTRY = helix(R_OUT, DECIDE_T, 0.95, yOut);
const RAMP_UP = helix(R_OUT, DECIDE_T, OUT_B + 0.1, yOut);   // stay on the loop, up to P4
const ENTRY = [P(-1.5, -6), P(2.6, -6), P(6, -6)];
const AISLE1_TO_EXIT = [P(29.5, -6), P(31.5, -8.5), P(31.5, -19.5), P(29.5, -22)];
const EXIT_UP = [P(4.5, -22), P(-4, -22), ...helix(R_OUT, -1.0, OUT_B + 0.1, yOut)];            // no space found: continue up to P4
const EXIT_DOWN = [P(4.5, -22), P(-4, -22), P(-8.4, -19.7), P(-11, -18.6), ...helix(R_IN, -Math.PI / 2, IN_B + 0.2, yIn)]; // leaving the mall
function bayApproach(b) {
  const s = b.aisle > b.z ? -1 : 1;
  if (b.aisle === -6) return [P(b.x - 3.2, -6), P(b.x, -6 + s * 1.7, { slow: true }), P(b.x, b.z, { slow: true })];
  return [...AISLE1_TO_EXIT, P(b.x + 3.2, -22), P(b.x, -22 + s * 1.7, { slow: true }), P(b.x, b.z, { slow: true })];
}
function bayLeave(b) {
  const out = [P(b.x, b.aisle, { rev: true, slow: true })];
  if (b.aisle === -6) out.push(P(b.x + 3, -6), ...AISLE1_TO_EXIT); else out.push(P(b.x - 3, -22));
  return [...out, ...EXIT_DOWN];
}

const cars = [];
let queued = 0;
const spawnPt = onCircle(R_OUT, SPAWN_T);
function spawnArrival() {
  const crowded = cars.some(c => c.mode === 'approach' && Math.hypot(c.g.position.x - spawnPt.x, c.g.position.z - spawnPt.z) < 8 && Math.abs(c.g.position.y - yOut(SPAWN_T)) < 1.5);
  if (crowded) { queued++; return; }
  const g = makeCar(); g.position.set(spawnPt.x, yOut(SPAWN_T), spawnPt.z);
  const heading = Math.atan2(Math.sin(SPAWN_T), -Math.cos(SPAWN_T));
  const c = { g, path: [...APPROACH], i: 0, mode: 'approach', heading, blockedT: 0 };
  g.rotation.y = heading; cars.push(c);
}
// The driver reads the sign as they pass under it.
function decide(c) {
  if (state.shown === 'UP') {
    c.mode = 'up'; c.path.push(...RAMP_UP);
    state.p4 = Math.max(0, state.p4 - 1);
    return;
  }
  c.mode = 'enter'; c.path.push(...TO_ENTRY, ...ENTRY);
  const free = bays.filter(b => !b.occupied && !b.reserved);
  if (free.length) { const b = free[Math.floor(Math.random() * free.length)]; b.reserved = true; c.bay = b; c.path.push(...bayApproach(b)); }
  else { c.mode = 'loop'; c.path.push(...AISLE1_TO_EXIT, ...EXIT_UP); }
}
function departRandom() {
  const parked = cars.filter(c => c.mode === 'parked');
  if (!parked.length) return;
  const c = parked[Math.floor(Math.random() * parked.length)];
  setBay(c.bay, false); c.bay.reserved = false;
  c.mode = 'leaving'; c.path = bayLeave(c.bay); c.i = 0; c.bay = null; c.seg = null;
}

(function seed() {
  bays.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 26).forEach(i => {
    const b = bays[i], g = makeCar();
    g.position.set(b.x, 0, b.z); g.rotation.y = b.face;
    setBay(b, true); b.reserved = true;
    cars.push({ g, path: [], i: 0, mode: 'parked', bay: b, heading: b.face, blockedT: 0 });
  });
})();

/* ---------- counting + sign ---------- */
const state = { mode: 'new', inCount: 26, outCount: 0, p4: 18, camOk: true, shown: 'GO', pending: null, pendingT: 0 };
const fx = [];
function makeTag(text, color) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
  const c = cv.getContext('2d'); c.font = `700 96px ${MONO}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = color; c.shadowColor = color; c.shadowBlur = 16; c.fillText(text, 128, 66);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthTest: false }));
  s.scale.set(2, 1, 1); return s;
}
function detect(car, dir) {
  if (dir === 'in') state.inCount++; else state.outCount++;
  if (state.mode === 'old') return;  // old system has no cameras: count silently, no visuals
  cams[dir].flash = 1;
  const color = dir === 'in' ? 0x3ee08a : 0xff6b8a;
  const helper = new THREE.BoxHelper(car.g, color); scene.add(helper);
  const tag = makeTag(dir === 'in' ? '+1' : '−1', dir === 'in' ? '#3ee08a' : '#ff6b8a');
  tag.position.copy(car.g.position).add(new THREE.Vector3(0, 2.6, 0)); scene.add(tag);
  fx.push({ helper, tag, t: 0 });
}
function compute() {
  const parked = bays.filter(b => b.occupied).length;
  const onFloor = state.inCount - state.outCount;
  const circ = Math.max(0, onFloor - parked);
  const free = CAP - parked, eff = free - circ;
  // old: bay sensors only (taken spaces), cameras ignored. new (No Cap): cars on floor from the cameras.
  const old = state.mode === 'old', count = old ? parked : onFloor;
  let raw = 'GO';
  if (!old && !state.camOk) raw = 'NO';
  else if (count >= UP_AT) raw = 'UP';  // sign says go up only once this many cars are counted on P3
  return { parked, onFloor, circ, free, eff, raw, old, count };
}
const $ = id => document.getElementById(id);
let lastSignKey = '';
function updateSignAndHud(dt) {
  const k = compute();
  if (k.raw === 'NO') { state.shown = 'NO'; state.pending = null; }
  else if (k.raw !== state.shown) {
    if (state.pending !== k.raw) { state.pending = k.raw; state.pendingT = 0; }
    state.pendingT += dt;
    if (state.pendingT > 1.2 || state.shown === 'NO') { state.shown = k.raw; state.pending = null; }
  } else state.pending = null;
  const ok = state.camOk, signOk = k.old || ok;
  const here = !signOk ? '–' : String(k.old ? k.free : Math.max(0, k.eff)), above = signOk ? String(state.p4) : '–';
  const key = state.mode + state.shown + here + above;
  if (key !== lastSignKey) { drawSign(state.shown, here, above); lastSignKey = key; }
  $('hIn').textContent = ok ? state.inCount : '–';
  $('hOut').textContent = ok ? state.outCount : '–';
  $('hOn').textContent = ok ? k.onFloor : '–';
  $('hPark').textContent = k.parked;
  $('hCirc').textContent = ok ? k.circ : '–';
  $('hFree').textContent = k.free;
  $('hEff').textContent = here;
  $('hP4').textContent = above;
  $('bigOn').textContent = signOk ? k.count : '–';
  $('bigCap').textContent = CAP;
}

/* ---------- movement ---------- */
const tmp = new THREE.Vector3();
function angleLerp(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; }
function blocked(c) {
  const fx_ = Math.sin(c.heading), fz = Math.cos(c.heading);
  for (const o of cars) {
    if (o === c || o.mode === 'parked') continue;
    tmp.subVectors(o.g.position, c.g.position);
    if (Math.abs(tmp.y) > 1.6) continue;
    const along = tmp.x * fx_ + tmp.z * fz; if (along <= 0 || along > 5.6) continue;
    if (Math.abs(tmp.x * fz - tmp.z * fx_) < 1.7) return true;
  }
  return false;
}
function stepCar(c, dt) {
  if (c.mode === 'parked') return;
  const wp = c.path[c.i];
  if (!wp) { finish(c); return; }
  const pos = c.g.position;
  if (!c.seg) c.seg = { x: pos.x, z: pos.z, y: pos.y, len: Math.max(1e-3, Math.hypot(wp.x - pos.x, wp.z - pos.z)) };
  if (!wp.rev) { if (blocked(c)) { c.blockedT += dt; if (c.blockedT < 3) return; } else c.blockedT = 0; }
  const dx = wp.x - pos.x, dz = wp.z - pos.z, dist = Math.hypot(dx, dz);
  const speed = wp.slow ? 2.4 : pos.x < 4 ? 6.5 : 5;
  const step = Math.min(dist, speed * dt), prevX = pos.x;
  if (dist > 1e-4) {
    pos.x += dx / dist * step; pos.z += dz / dist * step;
    const want = wp.rev ? Math.atan2(-dx, -dz) : Math.atan2(dx, dz);
    c.heading = angleLerp(c.heading, want, Math.min(1, dt * (wp.slow ? 4 : 7)));
  }
  const f = 1 - Math.max(0, dist - step) / c.seg.len;
  pos.y = c.seg.y + (wp.y - c.seg.y) * f;
  c.g.rotation.y = c.heading;
  c.g.rotation.x = wp.rev ? 0 : -Math.atan2(wp.y - c.seg.y, c.seg.len);
  if (prevX < 5 && pos.x >= 5 && pos.z > -8.6 && pos.z < -3.4) detect(c, 'in');
  if (prevX > 5 && pos.x <= 5 && pos.z > -24.6 && pos.z < -19.4) detect(c, 'out');
  if (dist - step < 0.08) { if (wp.decide) decide(c); c.i++; c.seg = null; }
}
function finish(c) {
  if (c.bay && c.mode === 'enter') {
    c.mode = 'parked'; setBay(c.bay, true); c.heading = c.bay.face;
    c.g.rotation.set(0, c.heading, 0); c.g.position.y = 0; return;
  }
  scene.remove(c.g); cars.splice(cars.indexOf(c), 1);
}

/* ---------- views ---------- */
const drvT = 2.3, drvP = onCircle(R_OUT, drvT);
const VIEWS = {
  wide: { pos: new THREE.Vector3(3, 38, 34), target: new THREE.Vector3(4, -1, -14) },
  driver: { pos: new THREE.Vector3(drvP.x, yOut(drvT) + 1.25, drvP.z), target: new THREE.Vector3(signPos.x, signLaneY + 2.3, signPos.z) },
};
camera.position.copy(VIEWS.wide.pos); controls.target.copy(VIEWS.wide.target);
let view = 'wide', camTween = null;
function goView(v) {
  view = v; const to = VIEWS[v];
  camTween = { t: 0, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: to.pos.clone(), toT: to.target.clone() };
  controls.enabled = v === 'wide';
}

/* ---------- auto traffic ---------- */
let auto = true, arriveT = 1, departT = 7, p4T = 6;
function tickAuto(dt) {
  if (!auto) return;
  arriveT -= dt; departT -= dt; p4T -= dt;
  if (arriveT <= 0) { spawnArrival(); arriveT = 2.8 + Math.random() * 2.4; }
  if (departT <= 0) { departRandom(); departT = 6 + Math.random() * 5; }
  if (p4T <= 0) { if (Math.random() < 0.6) state.p4 = Math.min(26, state.p4 + 1); p4T = 4 + Math.random() * 3; }
}

/* ---------- buttons ---------- */
$('bIn').addEventListener('click', spawnArrival);
$('bOut').addEventListener('click', departRandom);
$('bAuto').addEventListener('click', e => { auto = !auto; e.currentTarget.setAttribute('aria-pressed', String(auto)); });
$('bView').addEventListener('click', e => { const d = view !== 'driver'; goView(d ? 'driver' : 'wide'); e.currentTarget.setAttribute('aria-pressed', String(d)); });
$('bFault').addEventListener('click', e => {
  state.camOk = !state.camOk; e.currentTarget.setAttribute('aria-pressed', String(!state.camOk));
  Object.values(cams).forEach(c => { const col = state.camOk ? 0xff6b8a : 0x5b6371; c.cone.material.color.set(col); c.beam.material.color.set(col); });
});
$('bMode').addEventListener('click', e => {
  state.mode = state.mode === 'new' ? 'old' : 'new';
  const old = state.mode === 'old';
  e.currentTarget.setAttribute('aria-pressed', String(old));
  $('bigLbl').textContent = old ? 'ระบบเดิม · จอดแล้ว P3 / ช่องทั้งหมด' : 'รถในชั้น P3 / ช่องทั้งหมด';
  state.pending = null;
  Object.values(cams).forEach(c => { c.g.visible = c.cone.visible = c.beam.visible = !old; });
  document.querySelectorAll('#hud .cam, #hud .camdata').forEach(r => { r.hidden = old; });
  $('bFault').hidden = old;
});
$('bHud').addEventListener('click', e => { const h = $('hud'); h.hidden = !h.hidden; e.currentTarget.setAttribute('aria-pressed', String(!h.hidden)); });

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let queueT = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (queued > 0 && (queueT += dt) > 0.4) { queueT = 0; queued--; spawnArrival(); }
  tickAuto(dt);
  for (const c of cars.slice()) stepCar(c, dt);
  for (const f of fx.slice()) {
    f.t += dt; f.helper.update(); f.tag.position.y += dt * 1.2; f.tag.material.opacity = Math.max(0, 1 - f.t / 1.1);
    if (f.t > 1.1) { scene.remove(f.helper, f.tag); fx.splice(fx.indexOf(f), 1); }
  }
  for (const c of Object.values(cams)) { c.flash = Math.max(0, c.flash - dt * 1.6); c.cone.material.opacity = 0.07 + 0.3 * c.flash; }
  updateSignAndHud(dt);
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt / 1.2); const e = 1 - Math.pow(1 - camTween.t, 3);
    camera.position.lerpVectors(camTween.fromP, camTween.toP, e); controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }
  if (view === 'driver' && !camTween) camera.lookAt(controls.target); else controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
drawSign('GO', '–', '–');
(document.fonts && document.fonts.load ? Promise.all([
  document.fonts.load(`900 200px ${TH}`), document.fonts.load(`800 42px ${TH}`), document.fonts.load(`700 120px ${MONO}`)
]) : Promise.resolve()).catch(() => {}).then(() => { lastSignKey = ''; });
frame();
})();
</script>
